    .bg{position:fixed;inset:0;background:radial-gradient(ellipse 90% 55% at 50% 115%,rgba(18,36,68,.95) 0%,transparent 65%),radial-gradient(ellipse 55% 45% at 15% -5%,rgba(25,50,90,.55) 0%,transparent 55%),linear-gradient(155deg,#091322 0%,#0f1d30 45%,#0c1828 75%,#07101b 100%);z-index:0}

    /* CLOCK CANVAS */
    #clockCanvas{
      position:fixed;
      top:50%; left:50%;
      transform:translate(-50%,-50%);
      z-index:1;
      opacity:0;
      animation:fadeIn 1.6s .8s ease forwards;
      pointer-events:none;
    }

    /* ── GATE ── */
    #gate{position:fixed;inset:0;background:#07101b;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s ease}
    #gate.hide{opacity:0;pointer-events:none}
    .gate-logo{margin-bottom:2.8rem}
    .gate-logo img{height:45px;width:auto}
    .gate-label{font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;color:var(--dim);margin-bottom:1.6rem}
    .gate-form{display:flex;flex-direction:column;align-items:center;gap:.75rem;width:280px}
    .gate-input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:var(--white);font-family:inherit;font-size:.78rem;letter-spacing:.12em;padding:.85rem 1.2rem;outline:none;text-align:center;transition:border-color .2s,background .2s}
    .gate-input::placeholder{color:rgba(255,255,255,.22);letter-spacing:.12em}
    .gate-input:focus{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.09)}
    .gate-input.error{border-color:var(--accent);animation:shake .35s ease}
    .gate-btn{width:100%;background:var(--accent);border:1px solid var(--accent);color:var(--white);font-family:inherit;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;padding:.85rem 1rem;cursor:pointer;transition:background .2s}
    .gate-btn:hover{background:#c95228;border-color:#c95228}
    .gate-err{font-size:.62rem;letter-spacing:.12em;color:var(--accent);height:1em;text-align:center}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

    /* ── NAV — single centered logo ── */
    nav{
      position:fixed;top:0;left:0;right:0;
      padding:2rem;
      display:flex;justify-content:center;align-items:center;
      z-index:100;
    }
    .logo-center img{height:45px;width:auto;opacity:0;animation:fadeUp .8s .2s ease forwards}

    /* ── MAIN ── */
    main{position:relative;z-index:10;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:7rem 1rem 5rem}
    .content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
    .eyebrow{font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin-bottom:1.5rem;opacity:0;animation:fadeUp .7s .8s ease forwards}
    h1{font-family:'Aoki',sans-serif;font-weight:normal;font-size:clamp(4rem,12vw,9.5rem);line-height:.92;letter-spacing:.06em;color:var(--white);opacity:0;animation:fadeUp .9s 1s ease forwards;text-transform:uppercase}
    h1 .row2{display:block}
    h1 .slash{color:var(--accent)}
    .tagline{font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin-top:2rem;opacity:0;animation:fadeUp .7s 1.2s ease forwards}
    .subscribe{display:flex;margin-top:3.2rem;opacity:0;animation:fadeUp .8s 1.4s ease forwards}
    .subscribe input{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-right:none;color:var(--white);font-family:inherit;font-size:.7rem;letter-spacing:.06em;padding:.78rem 1.4rem;outline:none;width:220px;transition:background .2s,border-color .2s}
    .subscribe input::placeholder{color:rgba(255,255,255,.25)}
    .subscribe input:focus{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.28)}
    .subscribe button{background:var(--accent);border:1px solid var(--accent);color:var(--white);font-family:inherit;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;padding:.78rem 1.4rem;cursor:pointer;transition:background .2s;white-space:nowrap}
    .subscribe button:hover{background:#c95228;border-color:#c95228}

    /* ── SITE STATUS BUTTON ── */
    .status-wrap{
      position:fixed;bottom:2.2rem;left:50%;transform:translateX(-50%);
      z-index:100;
      opacity:0;animation:fadeIn 1s 1.8s ease forwards;
    }
    .status-btn{
      display:inline-flex;align-items:center;gap:.6rem;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.18);
      color:rgba(255,255,255,.7);
      font-family:inherit;
      font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;
      padding:.62rem 1.4rem;
      cursor:pointer;
      transition:background .2s,border-color .2s,color .2s;
      white-space:nowrap;
    }
    .status-btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.35);color:var(--white)}
    .status-dot{
      width:7px;height:7px;border-radius:50%;
      background:#2ecc71;
      box-shadow:0 0 6px rgba(46,204,113,.8);
      flex-shrink:0;
    }

    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}

    /* ── Mobile ── */
    @media(max-width:768px){
      nav{padding:1.4rem}
      .logo-center img{height:36px}
      .gate-logo img{height:36px}
      h1{font-size:clamp(3.8rem,18vw,7rem)}
      .subscribe{flex-direction:column;width:100%;max-width:280px}
      .subscribe input{width:100%;border-right:1px solid rgba(255,255,255,.14);border-bottom:none}
    }
    @media(max-width:480px){
      .logo-center img{height:30px}
    }
  </style>
</head>

  <script>
    /* ── CLOCK ── */
    (function() {
      var canvas = document.getElementById('clockCanvas');
      var ctx    = canvas.getContext('2d');

      function getSize() {
        var vw = window.innerWidth;
        var vh = window.innerHeight;
        return Math.max(300, Math.min(700, Math.min(vw, vh) * 0.85));
      }

      function resize() {
        var s = getSize();
        canvas.width  = s;
        canvas.height = s;
        canvas.style.width  = s + 'px';
        canvas.style.height = s + 'px';
      }

      function drawClock() {
        var s     = canvas.width;
        var cx    = s / 2;
        var cy    = s / 2;
        var R     = s / 2;
        var faceR = R * 0.88;

        ctx.clearRect(0, 0, s, s);

        var now  = new Date();
        var ms   = now.getMilliseconds();
        var sec  = now.getSeconds() + ms / 1000;
        var min  = now.getMinutes() + sec / 60;
        var hour = (now.getHours() % 12) + min / 60;

        /* outer ring */
        ctx.beginPath();
        ctx.arc(cx, cy, faceR, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,0.10)';
        ctx.lineWidth   = R * 0.004;
        ctx.stroke();

        /* tick marks — all 60, evenly spaced */
        for (var i = 0; i < 60; i++) {
          var angle = (i / 60) * Math.PI * 2 - Math.PI / 2;
          var cos   = Math.cos(angle);
          var sin   = Math.sin(angle);

          var isQuarter = (i % 15 === 0);
          var isHour    = (i % 5  === 0);

          var outerR, innerR, lw, alpha;
          if (isQuarter) {
            outerR = faceR;
            innerR = faceR * 0.84;
            lw     = R * 0.011;
            alpha  = 0.80;
          } else if (isHour) {
            outerR = faceR;
            innerR = faceR * 0.88;
            lw     = R * 0.007;
            alpha  = 0.55;
          } else {
            outerR = faceR;
            innerR = faceR * 0.935;
            lw     = R * 0.004;
            alpha  = 0.28;
          }

          ctx.beginPath();
          ctx.moveTo(cx + cos * outerR, cy + sin * outerR);
          ctx.lineTo(cx + cos * innerR, cy + sin * innerR);
          ctx.strokeStyle = 'rgba(255,255,255,' + alpha + ')';
          ctx.lineWidth   = lw;
          ctx.lineCap     = 'round';
          ctx.stroke();
        }

        /* helper — draw a hand */
        function hand(fraction, length, width, color, tailFrac) {
          var a  = fraction * Math.PI * 2 - Math.PI / 2;
          var hx = cx + Math.cos(a) * length;
          var hy = cy + Math.sin(a) * length;
          var tx = cx - Math.cos(a) * length * tailFrac;
          var ty = cy - Math.sin(a) * length * tailFrac;
          ctx.beginPath();
          ctx.moveTo(tx, ty);
          ctx.lineTo(hx, hy);
          ctx.strokeStyle = color;
          ctx.lineWidth   = width;
          ctx.lineCap     = 'round';
          ctx.stroke();
        }

        /* hour hand */
        hand(hour / 12, faceR * 0.50, R * 0.018, 'rgba(187,187,187,0.85)', 0.16);
        /* minute hand */
        hand(min  / 60, faceR * 0.72, R * 0.012, 'rgba(221,221,221,0.85)', 0.14);
        /* second hand */
        hand(sec  / 60, faceR * 0.78, R * 0.005, 'rgba(232,99,58,0.80)',   0.22);

        /* centre cap */
        ctx.beginPath();
        ctx.arc(cx, cy, R * 0.028, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(232,99,58,0.95)';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(cx, cy, R * 0.012, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.fill();
      }

      resize();
      window.addEventListener('resize', function() { resize(); });
      (function tick() { drawClock(); requestAnimationFrame(tick); })();
    })();

    /* ── PASSWORD GATE ── */
    (function () {
      var HASH  = '1e04c08b5350e6a0386c44b554c587dc9c7fe8f78bbac0483d8c1b582a74a393';
      var gate  = document.getElementById('gate');
      var input = document.getElementById('pwInput');
      var btn   = document.getElementById('pwBtn');
      var err   = document.getElementById('pwErr');

      if (sessionStorage.getItem('cs_unlocked') === '1') {
        gate.style.display = 'none';
      }

      async function attempt() {
        var val = input.value;
        if (!val) return;
        var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(val));
        var hex = Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
        if (hex === HASH) {
          sessionStorage.setItem('cs_unlocked','1');
          gate.classList.add('hide');
          setTimeout(function(){ gate.style.display='none'; }, 650);
        } else {
          err.textContent = 'Incorrect password.';
          input.classList.add('error');
          setTimeout(function(){ input.classList.remove('error'); err.textContent=''; }, 1200);
          input.select();
        }
      }

      btn.addEventListener('click', attempt);
      input.addEventListener('keydown', function(e){ if (e.key==='Enter') attempt(); });
    })();
  </script>
